    <style>
      :root {
        --bg-color: #ffffff;
        --text-primary: #333333;
        --text-muted: #767676;
        --link-color: #1565c0;
        --link-hover: #1e88e5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-primary: #e3e3e3;
          --text-muted: #9aa0a6;
          --link-color: #8ab4f8;
          --link-hover: #aecbfa;
        }
      }

      body,
      html {
        height: 100%;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .container {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        box-sizing: border-box;
        padding: 24px 16px;
      }

      .name,
      .title,
      .social,
      .contact {
        text-align: center;
      }

      .name {
        color: var(--text-primary);
        font-family: 'Trirong', serif;
        font-size: clamp(2.4em, 6vw, 3.2em);
        font-weight: bold;
        line-height: 1.2;
        margin: 0 0 12px 0;
      }

      .title {
        color: var(--text-muted);
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: clamp(1.4em, 3.5vw, 2em);
        line-height: 1.4;
        margin: 0;
      }

      .google-logo {
        height: 1.05em;
        width: auto;
        vertical-align: -0.22em;
        shape-rendering: geometricPrecision;
      }

      .social {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .social a {
        font-size: 3.5em;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .social a svg {
        height: 1em;
        width: auto;
        fill: currentColor;
      }

      .social a:hover {
        color: var(--text-primary);
        transform: translateY(-2px);
      }

      .contact {
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.2em;
      }

      .contact a {
        color: var(--link-color);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.2s ease;
      }

      .contact a:hover {
        color: var(--link-hover);
      }

      a:focus-visible {
        outline: 2px solid var(--link-color);
        outline-offset: 4px;
        border-radius: 4px;
      }
    </style>
